<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Closet App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-window">
      <div class="titlebar">
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="bars"><i></i><i></i><i></i></div>
        <div class="app-name">CLOSET APP</div>
        <div class="bars"><i></i><i></i><i></i></div>
        <div class="tab-label" id="tab-label">Today's Look</div>
      </div>

      <div class="tabrow">
        <button class="tabbtn active" data-tab="today">Today's Look</button>
        <button class="tabbtn" data-tab="wardrobe">Wardrobe</button>
        <button class="tabbtn" data-tab="saved">Saved Outfits</button>
      </div>

      <div class="content">
        <!-- TODAY'S LOOK -->
        <div class="tabview active" id="tab-today">
          <div id="carousel-panels"></div>
          <div class="acc-panel" id="acc-panel"></div>

          <div class="bottombar">
            <button class="rbtn primary" id="btn-save-look">Save Look</button>
            <button class="rbtn" id="btn-shuffle">Shuffle All</button>
            <button class="rbtn" id="btn-wear">Wear It</button>
            <span class="look-counter" id="look-counter">Look 1 of 1</span>
          </div>
          <div class="save-form" id="save-form" style="display: none">
            <input
              type="text"
              id="save-name-input"
              placeholder="Name this look…"
            />
            <button class="rbtn primary" id="save-confirm">Save</button>
            <button class="rbtn" id="save-cancel">Cancel</button>
          </div>
        </div>

        <!-- WARDROBE -->
        <div class="tabview" id="tab-wardrobe">
          <div class="chips" id="chips"></div>
          <div class="grid" id="wardrobe-grid"></div>
        </div>

        <!-- SAVED OUTFITS -->
        <div class="tabview" id="tab-saved">
          <div class="grid" id="saved-grid"></div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- ADD ITEM MODAL -->
    <div class="backdrop" id="add-backdrop">
      <div class="modal">
        <h2>ADD PIECE</h2>
        <div class="upload-zone" id="upload-zone">
          <input
            type="file"
            id="file-input"
            accept="image/*"
            style="display: none"
          />
          <div id="upload-placeholder">No photo yet</div>
          <img id="upload-preview" style="display: none" />
        </div>

        <div class="source-row" id="source-row">
          <button class="rbtn" id="btn-choose-file">📁 Choose Photo</button>
          <button class="rbtn" id="btn-open-camera">📷 Take Photo</button>
        </div>

        <div class="camera-box" id="camera-box" style="display: none">
          <video id="camera-video" autoplay playsinline muted></video>
          <div class="camera-actions">
            <button class="rbtn" id="btn-switch-camera" title="Switch camera">
              ⟳
            </button>
            <button class="rbtn primary" id="btn-capture">Capture</button>
            <button class="rbtn" id="btn-cancel-camera">Cancel</button>
          </div>
          <div
            class="camera-error"
            id="camera-error"
            style="display: none"
          ></div>
        </div>

        <div class="field">
          <label for="item-name">Name</label>
          <input
            type="text"
            id="item-name"
            placeholder="e.g. Navy Chore Jacket"
          />
        </div>
        <div class="field">
          <label for="item-category">Category</label>
          <select id="item-category">
            <option value="outerwear">Outerwear</option>
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
            <option value="shoes">Shoes</option>
            <option value="accessory">Accessory</option>
          </select>
        </div>
        <div class="field">
          <label for="item-color">Color tag</label>
          <input type="color" id="item-color" value="#6e6a3f" />
        </div>
        <div class="modal-actions">
          <button class="rbtn" id="cancel-add">Cancel</button>
          <button class="rbtn primary" id="confirm-add" disabled>
            Add to Wardrobe
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
